# Course registry.
#
# To add a course:
#   1. add an entry below
#   2. put local documents (pdf, md, txt, docx, pptx, html, png/jpg...) in its `docs_dir`, and/or
#      list web documents under `sources` (a URL string, or {url, title, license})
#   3. python -m scripts.fetch_sources --course <id>    # downloads `sources` into <docs_dir>/web/
#      python -m scripts.ingest --course <id>           # indexes everything in docs_dir
#
# Only add sources whose license allows reuse (Creative Commons, public domain, or your own material).
# Wikimedia diagrams link to upload.wikimedia.org PNG renders (Special: pages are disallowed by robots.txt).

courses:
  - id: ai
    name: Artificial Intelligence
    description: Foundations of AI, agents, search, reinforcement learning, transformers and LLMs.
    docs_dir: data/courses/ai
    sources:
      - {url: https://en.wikipedia.org/wiki/Artificial_intelligence, license: CC BY-SA 4.0}
      - {url: https://en.wikipedia.org/wiki/Intelligent_agent, license: CC BY-SA 4.0}
      - {url: https://en.wikipedia.org/wiki/A*_search_algorithm, license: CC BY-SA 4.0}
      - {url: https://en.wikipedia.org/wiki/Knowledge_representation_and_reasoning, license: CC BY-SA 4.0}
      - {url: https://en.wikipedia.org/wiki/Reinforcement_learning, license: CC BY-SA 4.0}
      - {url: https://en.wikipedia.org/wiki/Large_language_model, license: CC BY-SA 4.0}
      - {url: https://en.wikipedia.org/wiki/Transformer_(deep_learning_architecture), license: CC BY-SA 4.0}
      - {url: https://en.wikipedia.org/wiki/Retrieval-augmented_generation, license: CC BY-SA 4.0}
      - {url: https://en.wikipedia.org/wiki/Ethics_of_artificial_intelligence, license: CC BY-SA 4.0}
      - {url: https://d2l.ai/chapter_attention-mechanisms-and-transformers/queries-keys-values.html, title: "Dive into Deep Learning: Queries, Keys, and Values", license: CC BY-SA 4.0}
      - {url: https://d2l.ai/chapter_attention-mechanisms-and-transformers/transformer.html, title: "Dive into Deep Learning: The Transformer Architecture", license: CC BY-SA 4.0}
      - {url: https://d2l.ai/chapter_natural-language-processing-pretraining/bert.html, title: "Dive into Deep Learning: BERT", license: CC BY-SA 4.0}
