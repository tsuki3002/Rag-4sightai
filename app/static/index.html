<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Course Assistant</title>
<script src="https://cdn.jsdelivr.net/npm/marked@12/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3/dist/purify.min.js"></script>
<style>
  :root {
    --bg: #f7f7f5; --panel: #ffffff; --text: #1d1d1b; --muted: #6b6b66; --border: #e3e3de;
    --accent: #2f5bd3; --accent-soft: #e8eefc; --user: #1d1d1b; --user-text: #fff;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #161615; --panel: #1f1f1d; --text: #ecece8; --muted: #9a9a93; --border: #33332f;
      --accent: #7c9cff; --accent-soft: #252c40; --user: #ecece8; --user-text: #161615;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 15px/1.55 system-ui, -apple-system, sans-serif; background: var(--bg); color: var(--text); }
  .wrap { max-width: 820px; margin: 0 auto; padding: 0 16px; display: flex; flex-direction: column; height: 100dvh; }
  header { display: flex; gap: 12px; align-items: center; justify-content: space-between; padding: 16px 0; border-bottom: 1px solid var(--border); flex-wrap: wrap; }
  h1 { font-size: 17px; margin: 0; }
  select { font: inherit; padding: 6px 10px; border-radius: 8px; border: 1px solid var(--border); background: var(--panel); color: var(--text); }
  #log { flex: 1; overflow-y: auto; padding: 20px 0; display: flex; flex-direction: column; gap: 16px; }
  .msg { max-width: 100%; }
  .user { align-self: flex-end; background: var(--user); color: var(--user-text); padding: 10px 14px; border-radius: 14px 14px 4px 14px; max-width: 80%; white-space: pre-wrap; }
  .bot { background: var(--panel); border: 1px solid var(--border); padding: 14px 16px; border-radius: 14px 14px 14px 4px; }
  .bot p:first-child { margin-top: 0; } .bot p:last-child { margin-bottom: 0; }
  .cite { display: inline-block; font-size: 11px; font-weight: 600; background: var(--accent-soft); color: var(--accent); border-radius: 4px; padding: 0 5px; margin: 0 1px; cursor: pointer; text-decoration: none; vertical-align: 1px; }
  .sources { margin-top: 12px; padding-top: 10px; border-top: 1px solid var(--border); font-size: 13px; }
  .sources summary { cursor: pointer; color: var(--muted); }
  .src { margin: 8px 0 0; padding: 8px 10px; border-radius: 8px; background: var(--bg); }
  .src a { color: var(--accent); font-weight: 600; text-decoration: none; }
  .src .meta { color: var(--muted); }
  .src blockquote { margin: 6px 0 0; color: var(--muted); font-size: 12.5px; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .src.flash { outline: 2px solid var(--accent); }
  .empty { color: var(--muted); text-align: center; margin: auto; }
  form { display: flex; gap: 8px; padding: 12px 0 20px; }
  textarea { flex: 1; font: inherit; resize: none; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--border); background: var(--panel); color: var(--text); min-height: 46px; max-height: 160px; }
  button { font: inherit; font-weight: 600; padding: 0 18px; border-radius: 10px; border: 0; background: var(--accent); color: #fff; cursor: pointer; }
  button:disabled { opacity: .5; cursor: default; }
  .typing { color: var(--muted); font-style: italic; }
  .searched { color: var(--muted); font-size: 12px; margin-bottom: 6px; }
  .src img { display: block; max-width: 220px; max-height: 140px; margin-top: 6px; border-radius: 6px; border: 1px solid var(--border); background: #fff; }
  .lic { color: var(--muted); font-size: 11.5px; }
  .ghost { background: transparent; color: var(--text); border: 1px solid var(--border); padding: 6px 12px; font-weight: 500; }
  .controls { display: flex; gap: 8px; align-items: center; }
  .fb { display: flex; gap: 6px; align-items: center; margin-top: 10px; font-size: 12.5px; color: var(--muted); }
  .fb button { background: transparent; border: 1px solid var(--border); color: var(--text); padding: 2px 9px; border-radius: 6px; font-weight: 500; }
  .fb button.on { background: var(--accent-soft); border-color: var(--accent); }
  .fb input { flex: 1; min-width: 0; font: inherit; padding: 3px 8px; border-radius: 6px; border: 1px solid var(--border); background: var(--panel); color: var(--text); }
  .cursor::after { content: "▍"; color: var(--muted); animation: blink 1s steps(2) infinite; }
  @keyframes blink { 50% { opacity: 0; } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Course Assistant</h1>
    <div class="controls">
      <label>Course <select id="course"><option value="">All courses</option></select></label>
      <button class="ghost" id="new" type="button">New chat</button>
    </div>
  </header>
  <div id="log"></div>
  <form id="form">
    <textarea id="q" placeholder="e.g. What is the difference between supervised and unsupervised learning?" rows="1"></textarea>
    <button id="send">Ask</button>
  </form>
</div>
<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const IMAGE = /\.(png|jpe?g|webp|gif|bmp|tiff?)$/i;
let turn = 0;
let history = [];  // [{role, content}] sent with each question so follow-ups have context

function resetChat() {
  history = [];
  $("log").innerHTML = '<p class="empty" id="empty">Ask a question about your course material. Answers cite the documents they came from. Follow-up questions are fine.</p>';
}
resetChat();
$("new").addEventListener("click", () => { resetChat(); $("q").focus(); });
$("course").addEventListener("change", resetChat);

fetch("/courses").then((r) => r.json()).then((courses) => {
  for (const c of courses) $("course").insertAdjacentHTML("beforeend", `<option value="${esc(c.id)}">${esc(c.name)}</option>`);
  if (courses.length === 1) $("course").value = courses[0].id;
});

function add(cls, html) {
  $("empty")?.remove();
  const el = document.createElement("div");
  el.className = `msg ${cls}`;
  el.innerHTML = html;
  $("log").append(el);
  el.scrollIntoView({ behavior: "smooth", block: "end" });
  return el;
}

const localHref = (c) => "/files/" + c.source_path.split("/").map(encodeURIComponent).join("/");

function sourceLink(c) {
  const isPdf = c.source_path.toLowerCase().endsWith(".pdf");
  const web = c.source_url && /^https?:\/\//.test(c.source_url);
  const href = (web ? c.source_url : localHref(c)) + (isPdf && c.page ? `#page=${c.page}` : "");
  const where = [c.page && (c.source_path.endsWith(".pptx") ? `slide ${c.page}` : `p. ${c.page}`), c.section]
    .filter(Boolean).map(esc).join(" · ");
  let html = `<a href="${esc(href)}" target="_blank" rel="noopener">${esc(c.doc_title)}</a> <span class="meta">${where ? "— " + where : ""}</span>`;
  if (c.license) html += ` <span class="lic">(${esc(c.license)})</span>`;
  if (IMAGE.test(c.source_path)) html += `<img src="${localHref(c)}" alt="${esc(c.doc_title)}" loading="lazy">`;
  return html;
}

function render(data, question) {
  const t = ++turn;
  let html = DOMPurify.sanitize(marked.parse(data.answer));
  if (data.search_query && data.search_query !== question) html = `<div class="searched">Searched for: “${esc(data.search_query)}”</div>` + html;
  const ids = new Set(data.citations.map((c) => c.id));
  html = html.replace(/\[(\d+)\]/g, (m, n) => ids.has(+n) ? `<a class="cite" href="#src-${t}-${n}">${n}</a>` : m);
  if (data.citations.length) {
    html += `<details class="sources" open><summary>Sources (${data.citations.length})</summary>` +
      data.citations.map((c) => `<div class="src" id="src-${t}-${c.id}"><b>[${c.id}]</b> ${sourceLink(c)}<blockquote>${esc(c.text)}</blockquote></div>`).join("") +
      `</details>`;
  }
  return html;
}

function feedbackBar(id) {
  if (!id) return "";
  return `<div class="fb" data-id="${esc(id)}">Helpful?
    <button type="button" data-rating="1" aria-label="Helpful">👍</button>
    <button type="button" data-rating="-1" aria-label="Not helpful">👎</button></div>`;
}

async function sendFeedback(bar, rating, comment) {
  bar.querySelectorAll("button[data-rating]").forEach((b) => b.classList.toggle("on", +b.dataset.rating === rating));
  try {
    await fetch("/feedback", { method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ id: bar.dataset.id, rating, comment }) });
  } catch { /* feedback is best-effort */ }
}

$("log").addEventListener("click", (e) => {
  const fb = e.target.closest(".fb button[data-rating]");
  if (fb) {
    const bar = fb.closest(".fb"), rating = +fb.dataset.rating;
    sendFeedback(bar, rating, null);
    if (rating === -1 && !bar.querySelector("input")) {
      bar.insertAdjacentHTML("beforeend", '<input placeholder="What was wrong? (optional, press Enter)" maxlength="2000">');
      const input = bar.querySelector("input");
      input.focus();
      input.addEventListener("keydown", (ev) => {
        if (ev.key === "Enter" && input.value.trim()) { sendFeedback(bar, -1, input.value.trim()); input.replaceWith("Thanks for the feedback."); }
      });
    }
    return;
  }
  const a = e.target.closest(".cite");
  if (!a) return;
  e.preventDefault();
  const src = document.querySelector(a.getAttribute("href"));
  src?.scrollIntoView({ behavior: "smooth", block: "center" });
  src?.classList.add("flash");
  setTimeout(() => src?.classList.remove("flash"), 1200);
});

$("q").addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); $("form").requestSubmit(); }
});

$("form").addEventListener("submit", async (e) => {
  e.preventDefault();
  const question = $("q").value.trim();
  if (question.length < 2) return;
  $("q").value = "";
  $("send").disabled = true;
  add("user", esc(question));
  const bot = add("bot", '<span class="typing">Searching course material…</span>');
  try {
    const course = $("course").value;
    const res = await fetch("/ask/stream", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ question, course_ids: course ? [course] : null, history: history.slice(-12) }),
    });
    if (!res.ok) {
      const err = await res.json().catch(() => ({}));
      throw new Error(typeof err.detail === "string" ? err.detail : res.statusText);
    }
    // read server-sent events: meta, then text deltas, then done (or error)
    const reader = res.body.getReader(), decoder = new TextDecoder();
    let buffer = "", text = "", done = null;
    while (!done) {
      const { value, done: eof } = await reader.read();
      if (eof) break;
      buffer += decoder.decode(value, { stream: true });
      let sep;
      while ((sep = buffer.indexOf("\n\n")) >= 0) {
        const line = buffer.slice(0, sep).replace(/^data: /, "");
        buffer = buffer.slice(sep + 2);
        const ev = JSON.parse(line);
        if (ev.type === "delta") {
          text += ev.text;
          bot.innerHTML = `<div class="cursor">${DOMPurify.sanitize(marked.parse(text))}</div>`;
        } else if (ev.type === "error") {
          throw new Error(ev.message);
        } else if (ev.type === "done") {
          done = ev;
        }
      }
    }
    if (!done) throw new Error("The answer was interrupted — please try again.");
    history.push({ role: "user", content: question }, { role: "assistant", content: done.answer });
    bot.innerHTML = render(done, question) + feedbackBar(done.id);
  } catch (err) {
    bot.innerHTML = `<span class="typing">Something went wrong: ${esc(err.message)}</span>`;
  } finally {
    $("send").disabled = false;
    $("q").focus();
  }
});
</script>
</body>
</html>
